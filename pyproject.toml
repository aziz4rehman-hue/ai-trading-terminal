[project]
name = "ai-trading-terminal"
version = "0.1.0"
description = "Paper trading terminal with an analyst brief. No live orders. Not financial advice."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aziz Rehman" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/aziz4rehman-hue/ai-trading-terminal"

[project.scripts]
aiterm = "aiterm.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aiterm*"]
